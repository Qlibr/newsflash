# Runs the web component test suite on every push and pull request.
#
# The existing publish.yml only fires on release, so nothing checked the code
# before this. Tests run in a real Chromium via @web/test-runner (the component
# relies on browser DOMParser/XML, custom elements and IntersectionObserver, so
# jsdom is not a faithful stand-in).

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # web-test-runner.config.js only points at a pre-installed browser inside
      # the dev sandbox; in CI it falls back to Playwright's own Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm test

  php:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The plugin's floor is PHP 7.4, but PHPUnit 11 requires 8.3+, so the
      # suite runs on a modern PHP. The code under test is plain 7.4-compatible
      # PHP; a matrix that also lints against 7.4 could be added later.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        working-directory: wordpress
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: wordpress
        run: composer test
